<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    width: 100%;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }
  .scene {
    position: relative;
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    z-index: 1;
  }
  .halo {
    position: absolute; inset: -12%; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,229,0.06) 0%, transparent 65%);
    pointer-events: none;
  }
  svg { width: 100%; height: 100%; overflow: visible; }
  .scanlines {
    position: absolute; inset: 0; border-radius: 50%;
    background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
    pointer-events: none; mix-blend-mode: overlay;
  }
  .label {
    position: absolute; color: rgba(0,229,229,0.35);
    font-size: clamp(9px,1.2vw,12px); letter-spacing: 0.12em; pointer-events: none;
  }
  .label.tl { top:4%; left:4%; }
  .label.tr { top:4%; right:4%; text-align:right; }
  .label.bl { bottom:4%; left:4%; }
  .label.br { bottom:4%; right:4%; text-align:right; }
  .ecg-wrap {
    position: absolute; bottom: 3.5%; right: 1.5%;
    width: clamp(110px, 18vw, 160px);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(0,229,229,0.18);
    border-radius: 4px;
    padding: 6px 8px 5px;
    pointer-events: auto;
  }
  .ecg-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .ecg-label { color: rgba(0,229,229,0.4); font-size: clamp(7px,1vw,9px); letter-spacing: 0.12em; }
  .ecg-bpm   { color: rgba(0,229,229,0.85); font-size: clamp(11px,1.6vw,14px); letter-spacing: 0.06em; }
  .ecg-canvas { display: block; width: 100%; }
  .ecg-slider-outer {
    display: none;
  }
  #bpm-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: rgba(0,229,229,0.2);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
    display: block;
  }
  #bpm-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(0,229,229,0.85);
    border: none;
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,229,229,0.6);
  }
  #bpm-slider::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(0,229,229,0.85);
    border: none;
    cursor: pointer;
  }

  /* ── Spectrum visualizer ── */
  #spectrum-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 38vh;
    pointer-events: none;
    z-index: 0;
    filter: blur(6px) saturate(1.3);
    opacity: 0.45;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
  }
  #spectrum {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── MP3 Player ── */
  #mp3-player {
    position: fixed;
    left: 0;
    width: 160px;
    top: 50%;
    transform: translate(calc(10vw - 50%), -50%);
    z-index: 10;
    width: 160px;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(0,229,229,0.22);
    border-radius: 8px;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 24px rgba(0,229,229,0.08), inset 0 0 30px rgba(0,0,0,0.4);
    font-family: 'Share Tech Mono', monospace;
  }

  #mp3-player::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,229,229,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .mp3-title {
    color: rgba(0,229,229,0.9);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 0 8px rgba(0,229,229,0.5);
  }

  .mp3-progress-wrap {
    width: 100%;
  }

  .mp3-progress-track {
    width: 100%;
    height: 3px;
    background: rgba(0,229,229,0.12);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .mp3-progress-fill {
    height: 100%;
    width: 0%;
    background: rgba(0,229,229,0.75);
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(0,229,229,0.5);
    transition: width 0.25s linear;
  }

  .mp3-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mp3-btn {
    background: none;
    border: 1px solid rgba(0,229,229,0.25);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(0,229,229,0.8);
    transition: all 0.2s;
    outline: none;
  }

  .mp3-btn:hover {
    border-color: rgba(0,229,229,0.7);
    background: rgba(0,229,229,0.08);
    box-shadow: 0 0 10px rgba(0,229,229,0.2);
    color: #00e5e5;
  }

  .mp3-controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mp3-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* ── Beat waves ── */
  .mp3-ring {
    position: absolute;
    inset: -4px;
    border-radius: 10px;
    border: 1.5px solid rgba(0,229,229,0);
    pointer-events: none;
  }

  @keyframes mp3-wave {
    0%   { inset: -2px;  border-color: rgba(0,229,229,0.7); opacity: 1; }
    100% { inset: -28px; border-color: rgba(0,229,229,0);   opacity: 0; }
  }

  @keyframes mp3-border-flash {
    0%   { border-color: rgba(0,229,229,0.85); box-shadow: 0 0 18px rgba(0,229,229,0.4), inset 0 0 12px rgba(0,229,229,0.08); }
    100% { border-color: rgba(0,229,229,0.22); box-shadow: 0 0 24px rgba(0,229,229,0.08), inset 0 0 30px rgba(0,0,0,0.4); }
  }

  #mp3-player.beat-flash {
    animation: mp3-border-flash 0.35s ease-out forwards;
  }

  /* ── Intro animations ── */

  /* Player : caché à gauche au départ — état géré en JS */
  #mp3-player {
  }

  /* Séquence d'intro du player */
  @keyframes player-slide-in {
    0%   { opacity: 0; transform: translate(calc(10vw - 50%), -50%) translateX(-60px) scaleX(0.7); }
    60%  { opacity: 1; transform: translate(calc(10vw - 50%), -50%) translateX(6px)  scaleX(1.02); }
    100% { opacity: 1; transform: translate(calc(10vw - 50%), -50%) translateX(0)    scaleX(1); }
  }
  @keyframes player-border-boot {
    0%   { border-color: rgba(0,229,229,0.9); box-shadow: 0 0 32px rgba(0,229,229,0.5), inset 0 0 20px rgba(0,229,229,0.12); }
    60%  { border-color: rgba(0,229,229,0.5); box-shadow: 0 0 14px rgba(0,229,229,0.2), inset 0 0 10px rgba(0,229,229,0.06); }
    100% { border-color: rgba(0,229,229,0.22); box-shadow: 0 0 24px rgba(0,229,229,0.08), inset 0 0 30px rgba(0,0,0,0.4); }
  }
  /* Scan line qui balaye le player au boot */
  #mp3-player::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: linear-gradient(to bottom, transparent 0%, rgba(0,229,229,0.18) 50%, transparent 100%);
    background-size: 100% 30%;
    background-repeat: no-repeat;
    background-position: 0 -30%;
    pointer-events: none;
    opacity: 0;
  }
  @keyframes player-scan {
    0%   { opacity: 1; background-position: 0 -30%; }
    100% { opacity: 0; background-position: 0 130%; }
  }
  #mp3-player.intro-done::after { display: none; }

  /* ECG wrap : état initial géré en JS */
  .ecg-wrap {
  }
  @keyframes ecg-rise {
    0%   { opacity: 0; transform: translateY(12px) scaleY(0.6); clip-path: inset(100% 0 0 0); }
    40%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0)    scaleY(1);   clip-path: inset(0% 0 0 0); }
  }
  /* Titre du player : lettre par lettre via opacity + blur */
  .mp3-title {
    color: rgba(0,229,229,0.9);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 0 8px rgba(0,229,229,0.5);
  }
  @keyframes title-reveal {
    0%   { opacity: 0; filter: blur(8px);  letter-spacing: 0.5em; }
    60%  { opacity: 1; filter: blur(1px);  letter-spacing: 0.22em; }
    100% { opacity: 1; filter: blur(0px);  letter-spacing: 0.18em; }
  }
  /* Boutons : pop avec stagger */
  .mp3-btn {
  }
  @keyframes btn-pop {
    0%   { opacity: 0; transform: scale(0.4); }
    70%  { opacity: 1; transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* Barre de progression */
  .mp3-progress-track {
  }
  @keyframes progress-unfurl {
    0%   { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  #mp3-player.booting::after {
    opacity: 1;
    animation: player-scan 0.75s ease-in-out forwards;
  }
  #mp3-player.intro-done::after { display: none; }

  #dp-gif-wrap {
    width: 100%;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.55s cubic-bezier(0.22,1,0.36,1), opacity 0.45s ease;
  }
  #dp-gif-wrap.playing {
    max-height: 200px;
    opacity: 1;
  }
  #dp-gif {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
    mix-blend-mode: screen;
  }

</style>
</head>
<body>
<!-- Spectrum visualizer (fond) -->
<div id="spectrum-wrap">
  <canvas id="spectrum"></canvas>
</div>

<!-- MP3 Player -->
<div id="mp3-player">
  <div class="mp3-ring" id="mp3-ring1"></div>
  <div class="mp3-ring" id="mp3-ring2"></div>
  <div class="mp3-ring" id="mp3-ring3"></div>
  <div class="mp3-title">Around<br>the World</div>
  <div id="dp-gif-wrap">
    <img id="dp-gif" src="./daftpunk.gif" alt="Daft Punk" draggable="false">
  </div>
  <div class="mp3-progress-wrap">
    <div class="mp3-progress-track" id="mp3-track">
      <div class="mp3-progress-fill" id="mp3-fill"></div>
    </div>
  </div>
  <div class="mp3-controls-row">
    <button class="mp3-btn" id="mp3-play" title="Play / Pause">
      <svg viewBox="0 0 16 16" id="mp3-play-icon">
        <polygon points="3,1 14,8 3,15"/>
      </svg>
    </button>
    <button class="mp3-btn" id="mp3-stop" title="Stop">
      <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5"/></svg>
    </button>
  </div>
  <audio id="mp3-audio" src="musique.mp3" preload="metadata"></audio>
</div>
<div class="scene">
  <div class="halo" id="halo"></div>
  <svg id="svg" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="scanlines"></div>
  <span class="label tl">AF-XPLORER III</span>
  <span class="label tr">OCTARAY 2-2-2</span>
  <span class="label bl">VOLTA</span>
  <div class="ecg-wrap">
    <div class="ecg-top">
      <span class="ecg-label">ECG</span>
      <span class="ecg-bpm" id="ecg-bpm">0 <span style="font-size:0.7em;opacity:0.6">BPM</span></span>
    </div>
    <canvas class="ecg-canvas" id="ecg" height="36"></canvas>
  </div>
  <div class="ecg-slider-outer">
    <input type="range" id="bpm-slider" min="40" max="200" step="1" value="121">
  </div>
  </div>
</div>

<script>
const NS  = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const CX  = 340, CY = 340;
const haloEl = document.getElementById('halo');

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// ── Defs ─────────────────────────────────────────────────────────────────────
const defs = el('defs', {});

['cyan','red','orange'].forEach(name => {
  const f = el('filter', { id:`glow-${name}`, x:'-80%', y:'-80%', width:'260%', height:'260%' });
  f.innerHTML = `<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>`;
  defs.appendChild(f);
});

// Glow renforcé pour le flash sur les segments
['cyan','red','orange'].forEach(name => {
  const f = el('filter', { id:`glow-flash-${name}`, x:'-120%', y:'-120%', width:'340%', height:'340%' });
  f.innerHTML = `<feGaussianBlur stdDeviation="7" result="b1"/><feGaussianBlur stdDeviation="2" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>`;
  defs.appendChild(f);
});

const ringGlowF = el('filter', { id:'ring-glow', x:'-5%', y:'-5%', width:'110%', height:'110%' });
ringGlowF.innerHTML = `<feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>`;
defs.appendChild(ringGlowF);

const mBlurF = el('filter', { id:'motion-blur', x:'-50%', y:'-50%', width:'200%', height:'200%' });
const feBlur = el('feGaussianBlur', { stdDeviation:'0 0', result:'b' });
const feMergeEl = document.createElementNS(NS,'feMerge');
feMergeEl.innerHTML = `<feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>`;
mBlurF.appendChild(feBlur); mBlurF.appendChild(feMergeEl);
defs.appendChild(mBlurF);

const vig = el('radialGradient', { id:'vignette', cx:'50%', cy:'50%', r:'50%' });
vig.innerHTML = `<stop offset="60%" stop-color="rgba(10,10,10,0)"/><stop offset="100%" stop-color="rgba(10,10,10,0.7)"/>`;
defs.appendChild(vig);

svg.appendChild(defs);

// ── Background ────────────────────────────────────────────────────────────────
// Pas de fond opaque — on laisse le spectre traverser
// Juste un léger voile sombre pour conserver la lisibilité de l'étoile
svg.appendChild(el('circle', { cx:CX, cy:CY, r:320, fill:'rgba(10,10,10,0.45)' }));
svg.appendChild(el('circle', { cx:CX, cy:CY, r:320, fill:'url(#vignette)', opacity:0.4 }));
svg.appendChild(el('circle', { cx:CX, cy:CY, r:292, fill:'none', stroke:'rgba(0,229,229,0.06)', 'stroke-width':30 }));

// ── Ring — 8 independent arc segments ────────────────────────────────────────
const RING_R  = 292;
const N_SEGS  = 8;
const ARC_HALF = 19.75;
const ringGroup = el('g', { id:'ring', filter:'url(#ring-glow)' });
const segPaths  = [];

for (let i = 0; i < N_SEGS; i++) {
  const cDeg = i * 45 - 101.25;
  const a1 = (cDeg - ARC_HALF) * Math.PI / 180;
  const a2 = (cDeg + ARC_HALF) * Math.PI / 180;
  const p = el('path', {
    d: `M ${CX + RING_R*Math.cos(a1)} ${CY + RING_R*Math.sin(a1)} A ${RING_R} ${RING_R} 0 0 1 ${CX + RING_R*Math.cos(a2)} ${CY + RING_R*Math.sin(a2)}`,
    fill: 'none', stroke: '#00e5e5', 'stroke-width': 18, 'stroke-linecap': 'butt'
  });
  segPaths.push(p);
  ringGroup.appendChild(p);
}
svg.appendChild(ringGroup);

// ── Star — 8 spokes × 6 nodes ────────────────────────────────────────────────
const starGroup = el('g', { id:'star' });
const centerDot = el('circle', { cx:CX, cy:CY, r:5, fill:'#445', stroke:'rgba(0,229,229,0.2)', 'stroke-width':1 });
starGroup.appendChild(centerDot);

const DISTS  = [30, 68, 106, 144, 182, 220];
const ANGLES = [0, 45, 90, 135, 180, 225, 270, 315];
const NR = 6;
const nodeEls  = [];
const spokeEls = []; // toutes les lignes des spokes

const segPairs = [
  [6, DISTS[0]-6],
  [DISTS[0]+6, DISTS[1]-6],
  [DISTS[1]+6, DISTS[2]-6],
  [DISTS[2]+6, DISTS[3]-6],
  [DISTS[3]+6, DISTS[4]-6],
  [DISTS[4]+6, DISTS[5]-6],
];

for (let s = 0; s < 8; s++) {
  const g = el('g', { transform:`rotate(${ANGLES[s]} ${CX} ${CY})` });
  const spSpokes = [];
  for (const [r1,r2] of segPairs) {
    const ln = el('line', {
      x1:CX, y1:CY-r1, x2:CX, y2:CY-r2,
      stroke:'#4a5058', 'stroke-width':3, 'stroke-linecap':'round'
    });
    g.appendChild(ln);
    spSpokes.push(ln);
  }
  spokeEls.push(spSpokes);
  const snodes = [];
  for (let n = 0; n < NR; n++) {
    const c = el('circle', { cx:CX, cy:CY-DISTS[n], r:6, fill:'#0d0d0d', stroke:'#5a6068', 'stroke-width':2 });
    g.appendChild(c);
    snodes.push(c);
  }
  nodeEls.push(snodes);
  starGroup.appendChild(g);
}
svg.appendChild(starGroup);

// ── State ─────────────────────────────────────────────────────────────────────
const CYAN = '#00e5e5', RED = '#ff2244', ORANGE = '#ff8c00', OFF = '#0d0d0d';

const COLORS = { cyan: CYAN, red: RED, orange: ORANGE };

const nodeStates = Array.from({length:8}, () => Array(NR).fill('off'));
const segStates  = Array(N_SEGS).fill('cyan');
const nodePhase  = Array.from({length:8}, () => Array.from({length:NR}, () => Math.random()*Math.PI*2));

function setNode(s, n, state) {
  const c = nodeEls[s][n];
  nodeStates[s][n] = state;
  if (state === 'off') {
    c.setAttribute('fill', OFF);
    c.setAttribute('stroke', '#5a6068');
    c.setAttribute('stroke-width', 2);
    c.removeAttribute('filter');
    c.style.opacity = 1;
  } else {
    c.setAttribute('fill', COLORS[state] || CYAN);
    c.removeAttribute('stroke');
    c.setAttribute('filter', `url(#glow-${state})`);
  }
}

function setSeg(i, state) {
  segStates[i] = state;
  segPaths[i].setAttribute('stroke', COLORS[state] || CYAN);
}

// État initial : tout éteint — s'animera au Play
for (let s = 0; s < 8; s++)
  for (let n = 0; n < NR; n++)
    setNode(s, n, 'off');

// Segments du ring éteints (même couleur qu'un nœud éteint)
const OFF_RING = '#1a2020';
for (let i = 0; i < N_SEGS; i++) {
  segPaths[i].setAttribute('stroke', OFF_RING);
}

let flashActive = false;

// ── BPM fixe ─────────────────────────────────────────────────────────────────
const bpmState = {
  current: 121,  get beatMs() { return 60000 / this.current; }
};

let nextBeatTime = performance.now() + bpmState.beatMs;

// ── Slider BPM ────────────────────────────────────────────────────────────────
const bpmSlider  = document.getElementById('bpm-slider');
const bpmDisplay = document.getElementById('ecg-bpm');

// Anime le compteur BPM de `from` vers `to` en ~600ms
let bpmCountRaf = null;
function animateBpm(from, to) {
  if (bpmCountRaf) cancelAnimationFrame(bpmCountRaf);
  const DURATION = 600;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / DURATION, 1);
    // easeOutExpo pour un défilement rapide qui ralentit
    const ease = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const val = Math.round(from + (to - from) * ease);
    bpmDisplay.innerHTML = `${val} <span style="font-size:0.7em;opacity:0.6">BPM</span>`;
    if (t < 1) bpmCountRaf = requestAnimationFrame(tick);
    else bpmCountRaf = null;
  }
  bpmCountRaf = requestAnimationFrame(tick);
}

bpmSlider.addEventListener('input', () => {
  const val = parseInt(bpmSlider.value, 10);
  bpmState.current = val;
  updateBpmDisplay(val);
  // Resync le beat scheduler sur la nouvelle valeur
  nextBeatTime = performance.now() + bpmState.beatMs;
});

// ── MP3 player beat fx ────────────────────────────────────────────────────────
const mp3Player = document.getElementById('mp3-player');
const mp3Rings  = [
  document.getElementById('mp3-ring1'),
  document.getElementById('mp3-ring2'),
  document.getElementById('mp3-ring3'),
];
let mp3RingIdx = 0;
let mp3IsPlaying = false;  // controlled by the player

function triggerPlayerBeat() {
  if (!mp3IsPlaying) return;  // no animation if not playing

  // Border flash
  mp3Player.classList.remove('beat-flash');
  void mp3Player.offsetWidth;
  mp3Player.classList.add('beat-flash');

  // Staggered rings
  mp3Rings.forEach((ring, i) => {
    setTimeout(() => {
      ring.style.animation = 'none';
      void ring.offsetWidth;
      ring.style.animation = `mp3-wave ${0.55 + i * 0.08}s cubic-bezier(0.2,0.6,0.4,1) forwards`;
    }, i * 55);
  });
}

function onBeat() {
  triggerPlayerBeat();
  if (!introDone) return;
  rotBeatCounter++;
  if (rotBeatCounter % ROT_BEATS === 0) {
    startRotation(performance.now());
  }
  if (flashActive) return;
  for (let s = 0; s < 8; s++)
    for (let n = 0; n < NR; n++)
      if (Math.random() < 0.28) {
        const r = Math.random();
        setNode(s, n, r < 0.25 ? 'cyan' : r < 0.50 ? 'red' : r < 0.75 ? 'orange' : 'off');
      }
  for (let i = 0; i < N_SEGS; i++)
    if (Math.random() < 0.35) {
      const r = Math.random();
      setSeg(i, r < 0.33 ? 'red' : r < 0.66 ? 'orange' : 'cyan');
    }
}

// Scheduler de beat basé sur rAF + performance.now() — sans drift cumulatif
(function beatSchedulerLoop(now) {
  if (mp3IsPlaying && now >= nextBeatTime) {
    onBeat();
    // Avancer nextBeatTime par incréments entiers pour ne jamais accumuler de drift
    while (nextBeatTime <= now) nextBeatTime += bpmState.beatMs;
  }
  requestAnimationFrame(beatSchedulerLoop);
})(performance.now());

// ── Pulse oscillation on lit nodes ───────────────────────────────────────────
const PULSE_SPEED = (2 * Math.PI) / 1600;

function pulseTick(now) {
  if (!mp3IsPlaying) { requestAnimationFrame(pulseTick); return; }
  if (!flashActive)
    for (let s = 0; s < 8; s++)
      for (let n = 0; n < NR; n++)
        if (nodeStates[s][n] !== 'off')
          nodeEls[s][n].style.opacity = 0.55 + 0.45 * Math.sin(now * PULSE_SPEED + nodePhase[s][n]);
  requestAnimationFrame(pulseTick);
}
requestAnimationFrame(pulseTick);

// ── FX layer (particles) ──────────────────────────────────────────────────────
const fxLayer = el('g', { id:'fx' });
svg.appendChild(fxLayer);

const particles = [];

function spawnParticles(count) {
  const colors = [CYAN, RED, ORANGE, '#ffffff'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 230 + Math.random() * 80;
    const x = CX + radius * Math.cos(angle);
    const y = CY + radius * Math.sin(angle);
    const color = colors[Math.floor(Math.random() * colors.length)];
    const speed = 4 + Math.random() * 8;
    const vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 3;
    const vy = Math.sin(angle) * speed + (Math.random() - 0.5) * 3;
    const life = 0.9 + Math.random() * 0.4;
    const size = 1.5 + Math.random() * 2.5;
    const c = el('circle', { cx: x, cy: y, r: size, fill: color, opacity: 1 });
    fxLayer.appendChild(c);
    particles.push({ el: c, x, y, vx, vy, life, decay: 0.015 + Math.random() * 0.025, size });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= p.decay;
    if (p.life <= 0) {
      fxLayer.removeChild(p.el);
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.el.setAttribute('cx', p.x);
    p.el.setAttribute('cy', p.y);
    p.el.setAttribute('opacity', p.life);
  }
}

function fxTick() {
  updateParticles();
  requestAnimationFrame(fxTick);
}
requestAnimationFrame(fxTick);

function triggerFX() {
  spawnParticles(18 + Math.floor(Math.random() * 14));
}

// ── Flash intégré sur les composants ─────────────────────────────────────────
// Le flash se propage sur : segments ring, spokes, nodes allumés, dot central
// Pas de nappe centrale — tout passe par les éléments existants.

let flashRaf = null;
let flashCancelFlag = false; // flag global partagé avec animFlash

// Annule toute animation en cours (flash, rotation) et remet les éléments à l'état neutre
function cancelAllAnimations() {
  // Tuer le flash immédiatement via flag global
  flashCancelFlag = true;
  if (flashRaf) { cancelAnimationFrame(flashRaf); flashRaf = null; }
  flashActive = false;

  // Reset complet des attributs SVG modifiés par le flash
  segPaths.forEach(p => {
    p.setAttribute('stroke-width', '18');
    p.removeAttribute('filter');
  });
  ringGroup.setAttribute('filter', 'url(#ring-glow)');
  spokeEls.forEach(sp => sp.forEach(ln => {
    ln.setAttribute('stroke', '#4a5058');
    ln.setAttribute('stroke-width', '3');
  }));
  nodeEls.forEach(sp => sp.forEach(c => {
    c.style.opacity = '';
    c.removeAttribute('filter');
  }));
  centerDot.setAttribute('fill', '#445');
  centerDot.setAttribute('stroke', 'rgba(0,229,229,0.2)');
  centerDot.setAttribute('r', '5');
  haloEl.style.background = 'radial-gradient(circle, rgba(0,229,229,0.06) 0%, transparent 65%)';

  // Annuler la rotation en cours
  rotAnim = null;
  feBlur.setAttribute('stdDeviation', '0 0');
  starGroup.removeAttribute('filter');
}

function triggerFlash() {
  const pick   = Math.random();
  const name   = pick < 0.33 ? 'cyan' : pick < 0.66 ? 'red' : 'orange';
  const color  = COLORS[name];
  const glowId = `glow-flash-${name}`;
  const rgba   = name === 'cyan' ? 'rgba(0,229,229,' : name === 'red' ? 'rgba(255,34,68,' : 'rgba(255,140,0,';
  const dimSpoke = name === 'cyan' ? 'rgba(0,229,229,0.55)' : name === 'red' ? 'rgba(255,34,68,0.55)' : 'rgba(255,140,0,0.55)';
  const haloC  = rgba;

  // Snapshot des états courants
  const prevSegColors  = segPaths.map(p => p.getAttribute('stroke'));
  const prevSegWidths  = segPaths.map(p => p.getAttribute('stroke-width'));
  const prevSegFilters = segPaths.map(p => p.getAttribute('filter') || '');
  const prevRingFilter = ringGroup.getAttribute('filter');

  const prevSpokeColors = spokeEls.map(sp => sp.map(ln => ln.getAttribute('stroke')));
  const prevSpokeWidths = spokeEls.map(sp => sp.map(ln => ln.getAttribute('stroke-width')));

  const prevCenterFill   = centerDot.getAttribute('fill');
  const prevCenterStroke = centerDot.getAttribute('stroke');

  const prevNodeFills    = nodeEls.map(sp => sp.map(c => c.getAttribute('fill')));
  const prevNodeFilters  = nodeEls.map(sp => sp.map(c => c.getAttribute('filter') || ''));
  const prevNodeStrokes  = nodeEls.map(sp => sp.map(c => c.getAttribute('stroke') || ''));
  const prevNodeSW       = nodeEls.map(sp => sp.map(c => c.getAttribute('stroke-width') || ''));

  if (flashRaf) cancelAnimationFrame(flashRaf);
  flashActive = true;
  flashCancelFlag = false; // reset du flag pour ce nouveau flash
  const t0   = performance.now();
  const PEAK = 55;   // ms montée
  const FADE = 380;  // ms descente

  function animFlash(now) {
    if (flashCancelFlag) return; // annulé — ne rien toucher
    const dt = now - t0;
    let t; // 0→1 pic, 1→0 fade
    if (dt < PEAK) {
      t = dt / PEAK;
    } else {
      t = Math.max(0, 1 - (dt - PEAK) / FADE);
    }

    // ── Ring segments : couleur flash + épaississement + glow fort ──
    const sw = 18 + t * 10; // stroke-width peak ~28
    segPaths.forEach((p, i) => {
      const base = prevSegColors[i];
      // Interpoler vers la couleur flash
      p.setAttribute('stroke', t > 0.05 ? color : base);
      p.setAttribute('stroke-width', sw);
      p.setAttribute('filter', t > 0.05 ? `url(#${glowId})` : 'none');
    });
    // Le groupe ring n'a plus besoin de son propre filtre pendant le flash
    ringGroup.setAttribute('filter', t > 0.05 ? 'none' : (prevRingFilter || 'url(#ring-glow)'));

    // ── Spokes : s'illuminent dans la couleur flash ──
    const spokeAlpha = t * 0.9;
    spokeEls.forEach(sp => sp.forEach(ln => {
      ln.setAttribute('stroke', t > 0.05 ? dimSpoke : '#4a5058');
      ln.setAttribute('stroke-width', t > 0.05 ? (3 + t * 2) : 3);
    }));

    // ── Nodes : tous prennent la couleur flash sans exception ──
    for (let s = 0; s < 8; s++)
      for (let n = 0; n < NR; n++) {
        const c = nodeEls[s][n];
        if (t > 0.05) {
          c.setAttribute('fill', color);
          c.removeAttribute('stroke');
          c.setAttribute('filter', `url(#glow-${name})`);
          c.style.opacity = 1;
        } else {
          // Restauration progressive en fin de fade
          c.setAttribute('fill', prevNodeFills[s][n]);
          if (prevNodeFilters[s][n]) c.setAttribute('filter', prevNodeFilters[s][n]);
          else c.removeAttribute('filter');
          if (prevNodeStrokes[s][n]) c.setAttribute('stroke', prevNodeStrokes[s][n]);
          else c.removeAttribute('stroke');
          if (prevNodeSW[s][n]) c.setAttribute('stroke-width', prevNodeSW[s][n]);
        }
      }

    // ── Dot central ──
    if (t > 0.05) {
      centerDot.setAttribute('fill', color);
      centerDot.setAttribute('stroke', color);
      centerDot.setAttribute('r', 5 + t * 4);
    } else {
      centerDot.setAttribute('fill', prevCenterFill);
      centerDot.setAttribute('stroke', prevCenterStroke);
      centerDot.setAttribute('r', 5);
    }

    // ── Halo CSS léger synchronisé ──
    const ha = t * 0.18;
    haloEl.style.background = `radial-gradient(circle, ${haloC}${ha}) 0%, transparent 65%)`;

    if (dt < PEAK + FADE) {
      flashRaf = requestAnimationFrame(animFlash);
    } else {
      if (!flashCancelFlag) {
        // Restauration complète
        segPaths.forEach((p, i) => {
          p.setAttribute('stroke', prevSegColors[i]);
          p.setAttribute('stroke-width', prevSegWidths[i] || 18);
          p.setAttribute('filter', prevSegFilters[i] || 'none');
        });
        ringGroup.setAttribute('filter', prevRingFilter || 'url(#ring-glow)');
        spokeEls.forEach((sp, si) => sp.forEach((ln, li) => {
          ln.setAttribute('stroke', prevSpokeColors[si][li]);
          ln.setAttribute('stroke-width', prevSpokeWidths[si][li] || 3);
        }));
        nodeEls.forEach((sp, si) => sp.forEach((c, ni) => {
          c.setAttribute('fill', prevNodeFills[si][ni]);
          if (prevNodeFilters[si][ni]) c.setAttribute('filter', prevNodeFilters[si][ni]);
          else c.removeAttribute('filter');
          if (prevNodeStrokes[si][ni]) c.setAttribute('stroke', prevNodeStrokes[si][ni]);
          if (prevNodeSW[si][ni]) c.setAttribute('stroke-width', prevNodeSW[si][ni]);
        }));
        centerDot.setAttribute('fill', prevCenterFill);
        centerDot.setAttribute('stroke', prevCenterStroke);
        centerDot.setAttribute('r', 5);
        haloEl.style.background = 'radial-gradient(circle, rgba(0,229,229,0.06) 0%, transparent 65%)';
      }
      flashActive = false;
    }
  }
  flashRaf = requestAnimationFrame(animFlash);
}

// ── Rotation ─────────────────────────────────────────────────────────────────
let starAngle = 0, ringAngle = 0;

function easeOut(t) { return 1 - Math.pow(1-t, 3); }

function pickStepAngle() { return 90; }

// ── Intro animation ──────────────────────────────────────────────────────────
// Scale de 0 → 1, rotation rapide → 0, puis boucle normale
const INTRO_DUR = 1800; // ms durée totale de l'intro
const INTRO_SPIN_STAR =  720; // degrés parcourus en tout par l'étoile (sens horaire)
const INTRO_SPIN_RING = -720; // degrés parcourus en tout par le cadran (sens anti-horaire)

// Masquer les deux groupes au départ
const svgRoot = document.getElementById('svg');
svgRoot.style.transformOrigin = '50% 50%';

// Wrapping group pour le scale global
const introWrap = el('g', { id: 'intro-wrap' });
// Déplacer starGroup et ringGroup dans introWrap
svgRoot.insertBefore(introWrap, starGroup);
introWrap.appendChild(ringGroup);
introWrap.appendChild(starGroup);
introWrap.setAttribute('transform', `translate(0,0) scale(1)`);

// Easing pour le scale : ease-out cubic
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
// Easing pour la vitesse de spin : démarre vite → ralentit à 0
// On veut que la dérivée (vitesse) soit en easeOut — donc l'intégrale (position) est en easeOutQuad décalé
// Vitesse(t) = (1-t)^2, Position(t) = intégrale = t - t^2 + t^3/3 normalisée
function introSpinPos(t) {
  // Intégrale de (1-t)^2 de 0 à t, normalisée pour que la valeur en t=1 soit 1
  // intégrale = t - t² + t³/3, valeur en 1 = 1 - 1 + 1/3 = 1/3 → normaliser × 3
  return (t - t*t + t*t*t/3) * 3;
}

let introStartTime = null;
let introDone = false;

// Suspendre la rotLoop jusqu'à la fin de l'intro
let introResolve = null;
const introPromise = new Promise(r => { introResolve = r; });

// Partir de scale 0 dès le chargement
introWrap.setAttribute('transform', `translate(${CX * (1 - 0)},${CY * (1 - 0)}) scale(0)`);

function introTick(now) {
  if (!introStartTime) introStartTime = now;
  const elapsed = now - introStartTime;
  const rawT = Math.min(elapsed / INTRO_DUR, 1);

  const scaleT = easeOutCubic(rawT);
  const spinT  = introSpinPos(rawT);

  const currentStarSpin  =  INTRO_SPIN_STAR * spinT;
  const currentRingSpin  =  INTRO_SPIN_RING * spinT;

  // Scale centré sur le centre du SVG (340,340)
  const s = scaleT;
  const tx = CX * (1 - s);
  const ty = CY * (1 - s);
  introWrap.setAttribute('transform', `translate(${tx},${ty}) scale(${s})`);

  // Appliquer la rotation intro en plus des angles courants
  starGroup.setAttribute('transform', `rotate(${starAngle + currentStarSpin} ${CX} ${CY})`);
  ringGroup.setAttribute('transform', `rotate(${ringAngle + currentRingSpin} ${CX} ${CY})`);

  // Motion blur proportionnel à la vitesse (dérivée de spinT)
  const vel = rawT < 1 ? (1 - rawT) * (1 - rawT) : 0; // (1-t)^2
  const blurVal = vel * 18;
  feBlur.setAttribute('stdDeviation', `${blurVal} 0`);
  if (blurVal > 0.5) {
    starGroup.setAttribute('filter', 'url(#motion-blur)');
    ringGroup.setAttribute('filter', 'url(#motion-blur)');
  }

  if (rawT < 1) {
    requestAnimationFrame(introTick);
  } else {
    // Fin de l'intro : nettoyer et laisser la boucle normale prendre le relais
    introWrap.setAttribute('transform', '');
    starGroup.setAttribute('transform', `rotate(${starAngle} ${CX} ${CY})`);
    ringGroup.setAttribute('transform', `rotate(${ringAngle} ${CX} ${CY})`);
    starGroup.removeAttribute('filter');
    ringGroup.setAttribute('filter', 'url(#ring-glow)');
    feBlur.setAttribute('stdDeviation', '0 0');
    introDone = true;
    introResolve();
  }
}
requestAnimationFrame(introTick);

// ── Rotation pilotée par les beats ───────────────────────────────────────────
// Chaque rotation est ancrée sur le timestamp exact du beat — zéro drift.
const ROT_BEATS = 2; // une rotation toutes les 2 beats
let rotBeatCounter = 0;
let rotAnim = null; // { s0, r0, starStep, ringStep, beatStartTime, beatDur }

function startRotation(beatTime) {
  if (rotAnim) return;
  const snapBeatMs = bpmState.beatMs;
  const step     = Math.random() < 0.5 ? 45 : 90;
  const starStep = step * (Math.random() < 0.5 ? 1 : -1);
  const ringStep = step * (Math.random() < 0.5 ? 1 : -1);
  rotAnim = {
    s0: starAngle, r0: ringAngle,
    starStep, ringStep,
    beatStartTime: beatTime,
    beatDur: snapBeatMs * 0.32,
  };
  triggerFX();
}

function rotTick(now) {
  if (rotAnim) {
    if (rotNeedsReset) {
      rotNeedsReset = false;
      starGroup.removeAttribute('filter');
      ringGroup.setAttribute('filter', 'url(#ring-glow)');
      feBlur.setAttribute('stdDeviation', '0 0');
      rotAnim = null;
    } else {
      const { s0, r0, starStep, ringStep, beatStartTime, beatDur } = rotAnim;
      const raw = Math.min((now - beatStartTime) / beatDur, 1);
      const t   = easeOut(raw);
      const spd = raw < 1 ? (1 - raw) : 0;

      feBlur.setAttribute('stdDeviation', `${spd * 14} 0`);
      if (spd > 0.01) {
        starGroup.setAttribute('filter', 'url(#motion-blur)');
        ringGroup.setAttribute('filter', 'url(#motion-blur)');
      } else {
        starGroup.removeAttribute('filter');
        ringGroup.setAttribute('filter', 'url(#ring-glow)');
        feBlur.setAttribute('stdDeviation', '0 0');
      }

      starAngle = s0 + starStep * t;
      ringAngle = r0 + ringStep * t;
      starGroup.setAttribute('transform', `rotate(${starAngle} ${CX} ${CY})`);
      ringGroup.setAttribute('transform', `rotate(${ringAngle} ${CX} ${CY})`);

      if (raw >= 1) {
        starAngle = s0 + starStep;
        ringAngle = r0 + ringStep;
        starGroup.setAttribute('transform', `rotate(${starAngle} ${CX} ${CY})`);
        ringGroup.setAttribute('transform', `rotate(${ringAngle} ${CX} ${CY})`);
        triggerFlash();
        rotAnim = null;
      }
    }
  }
  requestAnimationFrame(rotTick);
}
requestAnimationFrame(rotTick);

// ── Gestion visibilité onglet ─────────────────────────────────────────────────
// Quand l'onglet revient au premier plan, on remet à zéro toutes les horloges
// pour éviter le "rattrapage" brutal (freeze ou accélération).
let pageHidden = false;

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pageHidden = true;
  } else {
    // Retour sur l'onglet : reset des horloges
    pageHidden = false;
    // Beat scheduler : prochain beat dans un beatMs depuis maintenant
    nextBeatTime = performance.now() + bpmState.beatMs;
    // ECG : lastTime sera resetté au prochain tick via le null check
    ecgLastTimeRef.value = null;
    // Rotation : le t0 courant sera trop vieux → on skip l'étape en cours
    rotNeedsReset = true;
  }
});

// Refs partagées pour le reset
const ecgLastTimeRef = { value: null };
let rotNeedsReset = false;

// rotLoop supprimé — la rotation est désormais déclenchée directement par onBeat()

// ── ECG tracer ────────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('ecg');
  const ctx    = canvas.getContext('2d');

  // Forme d'un battement ECG normalisé
  const WAVEFORM = [
    [0,    0],
    [0.08, 0],
    [0.10,-0.12], // onde P début
    [0.13, 0.18], // onde P pic
    [0.16,-0.05], // onde P fin
    [0.19,-0.05],
    [0.22,-0.22], // Q
    [0.25, 1.00], // R pic (QRS)
    [0.28,-0.30], // S
    [0.31,-0.05],
    [0.35, 0],
    [0.42, 0.08], // onde T début
    [0.50, 0.22], // onde T pic
    [0.58, 0.06],
    [0.63, 0],
    [1.00, 0],
  ];

  function sampleWave(phase) {
    // phase 0..1 dans le cycle
    for (let i = 1; i < WAVEFORM.length; i++) {
      const [t0, a0] = WAVEFORM[i-1];
      const [t1, a1] = WAVEFORM[i];
      if (phase <= t1) {
        const tt = (phase - t0) / (t1 - t0);
        return a0 + (a1 - a0) * tt;
      }
    }
    return 0;
  }

  const TRACE_COLOR = '#00e5e5';
  const GRID_COLOR  = 'rgba(0,229,229,0.07)';

  let W, H;
  let buffer;
  let bufCtx;
  let writeX = 0;
  let prevY  = null;

  function resize() {
    W = canvas.offsetWidth;
    H = canvas.height;
    canvas.width = W;
    buffer = document.createElement('canvas');
    buffer.width  = W;
    buffer.height = H;
    bufCtx = buffer.getContext('2d');
    bufCtx.clearRect(0, 0, W, H);
    writeX = 0;
    prevY  = null;
  }
  resize();

  let lastTime = null;
  let phase = 0;

  // Transition douce entre ligne plate et ondes
  let waveAmp = 0; // 0 = plat, 1 = ondes complètes

  function ecgTick(now) {
    // Transition douce de l'amplitude
    const ampTarget = mp3IsPlaying ? 1 : 0;
    waveAmp += (ampTarget - waveAmp) * 0.035;
    if (Math.abs(waveAmp - ampTarget) < 0.001) waveAmp = ampTarget;

    // Reset si retour d'onglet
    if (ecgLastTimeRef.value === null) lastTime = null;
    ecgLastTimeRef.value = now;

    if (!lastTime) { lastTime = now; requestAnimationFrame(ecgTick); return; }
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    const BEAT_S = 60 / bpmState.current;
    const SCROLL_PX = 1.4;

    const STEPS = Math.max(1, Math.round(dt / (1/120)));
    const dtStep = dt / STEPS;
    const pxStep = SCROLL_PX / STEPS;

    for (let s = 0; s < STEPS; s++) {
      phase += dtStep / BEAT_S;
      if (phase >= 1) phase -= 1;

      const amp    = sampleWave(phase) * waveAmp;
      const midY   = H * 0.52;
      const scaleY = H * 0.38;
      const curY   = midY - amp * scaleY;
      const curX   = writeX;

      // Effacer la zone devant le curseur
      const ERASE_W = 10;
      bufCtx.clearRect(curX, 0, ERASE_W + 2, H);

      // Grille verticale
      if (Math.floor(curX / 40) !== Math.floor((curX - pxStep) / 40)) {
        bufCtx.strokeStyle = GRID_COLOR;
        bufCtx.lineWidth = 0.5;
        bufCtx.beginPath();
        bufCtx.moveTo(curX, 0);
        bufCtx.lineTo(curX, H);
        bufCtx.stroke();
      }

      // Segment continu de prevY → curY
      if (prevY !== null) {
        bufCtx.strokeStyle = TRACE_COLOR;
        bufCtx.lineWidth = 1.4;
        bufCtx.lineJoin = 'round';
        bufCtx.lineCap  = 'round';
        bufCtx.shadowColor = TRACE_COLOR;
        bufCtx.shadowBlur  = 3;
        bufCtx.beginPath();
        bufCtx.moveTo(curX - pxStep, prevY);
        bufCtx.lineTo(curX, curY);
        bufCtx.stroke();
        bufCtx.shadowBlur = 0;
      }

      // Curseur lumineux
      bufCtx.fillStyle = 'rgba(0,229,229,0.9)';
      bufCtx.beginPath();
      bufCtx.arc(curX, curY, 1.5, 0, Math.PI*2);
      bufCtx.fill();

      prevY  = curY;
      writeX = (writeX + pxStep) % W;
    }

    // Copier buffer → canvas (scroll circulaire)
    const ERASE_W = 10;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(writeX, 0, ERASE_W, H);

    ctx.globalAlpha = 0.88;
    if (writeX + ERASE_W < W) {
      ctx.drawImage(buffer, writeX + ERASE_W, 0, W - writeX - ERASE_W, H,
                             writeX + ERASE_W, 0, W - writeX - ERASE_W, H);
    }
    ctx.drawImage(buffer, 0, 0, writeX, H, 0, 0, writeX, H);
    ctx.globalAlpha = 1;

    requestAnimationFrame(ecgTick);
  }
  requestAnimationFrame(ecgTick);
})();
// ── Spectrum visualizer (fond) ────────────────────────────────────────────────
(function() {
  const wrap    = document.getElementById('spectrum-wrap');
  const canvas  = document.getElementById('spectrum');
  const ctx     = canvas.getContext('2d');

  const N_BARS      = 80;
  const SMOOTH_UP   = 0.18;
  const SMOOTH_DOWN = 0.06;
  const PEAK_HOLD   = 38;
  const PEAK_FALL   = 0.013;

  const phases    = Array.from({length: N_BARS}, () => Math.random() * Math.PI * 2);
  const freqs     = Array.from({length: N_BARS}, (_, i) => 0.0004 + (i / N_BARS) * 0.0035);
  const baseAmps  = Array.from({length: N_BARS}, (_, i) => {
    const x = i / N_BARS;
    return 0.55 * Math.exp(-Math.pow((x - 0.18) / 0.22, 2))
         + 0.30 * Math.exp(-Math.pow((x - 0.50) / 0.28, 2))
         + 0.12 * Math.exp(-Math.pow((x - 0.78) / 0.18, 2));
  });

  const heights   = new Float32Array(N_BARS);
  const peaks     = new Float32Array(N_BARS);
  const peakHolds = new Int32Array(N_BARS);

  let W = 0, H = 0;
  function resize() {
    W = canvas.offsetWidth  || window.innerWidth;
    H = canvas.offsetHeight || wrap.offsetHeight;
    canvas.width  = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  // Couleurs : cyan → orange → rouge
  // Le seuil de rouge est abaissé à 0.35 (au lieu de 0.5) pour qu'il apparaisse
  // bien plus souvent — les barres hautes virent franchement au rouge
  function barColor(normH) {
    if (normH < 0.35) {
      // cyan → orange
      const t = normH / 0.35;
      return `rgb(${Math.round(t*255)},${Math.round(229+t*(140-229))},${Math.round(229*(1-t))})`;
    } else {
      // orange → rouge (sur les 65% supérieurs)
      const t = (normH - 0.35) / 0.65;
      return `rgb(255,${Math.round(140*(1-t))},0)`;
    }
  }

  function spectrumTick(now) {
    if (!mp3IsPlaying) {
      // Décroissance progressive vers zéro
      let anyVisible = false;
      for (let i = 0; i < N_BARS; i++) {
        heights[i] *= 0.88;
        peaks[i]   *= 0.90;
        if (heights[i] > 0.002) anyVisible = true;
      }
      if (anyVisible) {
        ctx.clearRect(0, 0, W, H);
        const barW = W / N_BARS;
        const gap  = Math.max(1, barW * 0.18);
        const bw   = barW - gap;
        for (let i = 0; i < N_BARS; i++) {
          const h  = heights[i] * H * 0.92;
          if (h < 0.5) continue;
          const x   = i * barW + gap * 0.5;
          const col = barColor(heights[i]);
          const ca  = col.replace('rgb(', 'rgba(').replace(')', ',');
          const grad = ctx.createLinearGradient(0, H - h, 0, H);
          grad.addColorStop(0,   `${ca}0.9)`);
          grad.addColorStop(0.6, `${ca}0.5)`);
          grad.addColorStop(1,   `${ca}0.1)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(x, H - h, bw, h, [2, 2, 0, 0]);
          ctx.fill();
        }
      } else {
        ctx.clearRect(0, 0, W, H);
      }
      requestAnimationFrame(spectrumTick);
      return;
    }
    const beatPhase = ((now % bpmState.beatMs) / bpmState.beatMs);
    const beatPulse = Math.exp(-beatPhase * 6) * 0.35;

    for (let i = 0; i < N_BARS; i++) {
      phases[i] += freqs[i] * 16;

      const osc   = 0.5 + 0.5 * Math.sin(phases[i]);
      const osc2  = 0.5 + 0.5 * Math.sin(phases[i] * 2.3 + 1.1);
      const noise = 0.5 + 0.5 * Math.sin(phases[i] * 5.7 + 2.9);

      const beatBoost = i < 25 ? beatPulse * (1 - i / 25) : 0;

      // +20% de hauteur via le multiplicateur 1.20
      const target = (baseAmps[i] * (osc * 0.5 + osc2 * 0.3 + noise * 0.2) + beatBoost) * 1.20;

      const smooth = target > heights[i] ? SMOOTH_UP : SMOOTH_DOWN;
      heights[i] += (target - heights[i]) * smooth;
      heights[i] = Math.min(heights[i], 1.0);

      if (heights[i] >= peaks[i]) {
        peaks[i]     = heights[i];
        peakHolds[i] = PEAK_HOLD;
      } else {
        if (peakHolds[i] > 0) peakHolds[i]--;
        else peaks[i] = Math.max(0, peaks[i] - PEAK_FALL);
      }
    }

    ctx.clearRect(0, 0, W, H);
    const barW = W / N_BARS;
    const gap  = Math.max(1, barW * 0.18);
    const bw   = barW - gap;

    for (let i = 0; i < N_BARS; i++) {
      const h   = heights[i] * H * 0.92;
      const x   = i * barW + gap * 0.5;
      const col = barColor(heights[i]);
      const ca  = col.replace('rgb(', 'rgba(').replace(')', ',');

      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0,   `${ca}0.9)`);
      grad.addColorStop(0.6, `${ca}0.5)`);
      grad.addColorStop(1,   `${ca}0.1)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, H - h, bw, h, [2, 2, 0, 0]);
      ctx.fill();

      const reflH = h * 0.22;
      const rGrad = ctx.createLinearGradient(0, H, 0, H + reflH);
      rGrad.addColorStop(0, `${ca}0.12)`);
      rGrad.addColorStop(1, `${ca}0.00)`);
      ctx.fillStyle = rGrad;
      ctx.beginPath();
      ctx.roundRect(x, H, bw, reflH, [0, 0, 2, 2]);
      ctx.fill();

      if (peaks[i] > 0.04) {
        const py = H - peaks[i] * H * 0.92 - 1;
        ctx.fillStyle = barColor(peaks[i]).replace('rgb(', 'rgba(').replace(')', ',0.7)');
        ctx.fillRect(x, py, bw, 1.5);
      }
    }

    requestAnimationFrame(spectrumTick);
  }
  requestAnimationFrame(spectrumTick);
})();

// ── Animations d'intro UI (player + ECG) ─────────────────────────────────────
(function() {
  const player   = document.getElementById('mp3-player');
  const ecgWrap  = document.querySelector('.ecg-wrap');
  const title    = player.querySelector('.mp3-title');
  const btns     = player.querySelectorAll('.mp3-btn');
  const track    = player.querySelector('.mp3-progress-track');

  const BASE = 200; // ms après le chargement

  // ── États initiaux (tout invisible) ──
  player.style.cssText += '; opacity:0; transform:translate(calc(10vw - 50%), -50%) translateX(-60px);';
  ecgWrap.style.cssText += '; opacity:0; transform:translateY(14px);';
  title.style.cssText   += '; opacity:0; filter:blur(8px); letter-spacing:0.5em;';
  track.style.cssText   += '; opacity:0; transform:scaleX(0); transform-origin:left;';
  btns.forEach(btn => { btn.style.opacity = '0'; btn.style.transform = 'scale(0.4)'; });

  // ── Helper : applique une animation CSS one-shot ──
  function animate(el, anim, duration, easing, delay, fill = 'forwards') {
    el.style.animation = `${anim} ${duration}ms ${easing} ${delay}ms ${fill}`;
  }

  // 1. Player glisse depuis la gauche
  setTimeout(() => {
    animate(player, 'player-slide-in', 750, 'cubic-bezier(0.22,1,0.36,1)', 0);
  }, BASE);

  // 2. Scan line boot
  setTimeout(() => {
    player.classList.add('booting');
  }, BASE + 80);

  // 3. Titre révélé
  setTimeout(() => {
    animate(title, 'title-reveal', 800, 'cubic-bezier(0.22,1,0.36,1)', 0);
  }, BASE + 350);

  // 4. Barre de progression
  setTimeout(() => {
    animate(track, 'progress-unfurl', 500, 'cubic-bezier(0.22,1,0.36,1)', 0);
  }, BASE + 550);

  // 5. Boutons pop en stagger
  btns.forEach((btn, i) => {
    setTimeout(() => {
      animate(btn, 'btn-pop', 450, 'cubic-bezier(0.34,1.56,0.64,1)', 0);
    }, BASE + 620 + i * 90);
  });

  // 6. ECG wrap monte depuis le bas
  setTimeout(() => {
    animate(ecgWrap, 'ecg-rise', 650, 'cubic-bezier(0.22,1,0.36,1)', 0);
  }, BASE + 500);

  // ── Nettoyage : retour aux styles natifs ──
  setTimeout(() => {
    player.classList.add('intro-done');
    player.classList.remove('booting');

    // Player : retirer tout inline sauf le transform positionnel d'origine
    player.style.animation  = '';
    player.style.opacity    = '';
    player.style.transform  = 'translate(calc(10vw - 50%), -50%)';

    // ECG wrap
    ecgWrap.style.animation  = '';
    ecgWrap.style.opacity    = '';
    ecgWrap.style.transform  = '';

    // Titre : retour aux valeurs CSS de la règle .mp3-title
    title.style.animation      = '';
    title.style.opacity        = '';
    title.style.filter         = '';
    title.style.letterSpacing  = '';

    // Progress track
    track.style.animation        = '';
    track.style.opacity          = '';
    track.style.transform        = '';
    track.style.transformOrigin  = '';

    // Boutons
    btns.forEach(btn => {
      btn.style.animation  = '';
      btn.style.opacity    = '';
      btn.style.transform  = '';
    });
  }, BASE + 1700);
})();


(function() {
  const audio    = document.getElementById('mp3-audio');
  const playBtn  = document.getElementById('mp3-play');
  const stopBtn  = document.getElementById('mp3-stop');
  const playIcon = document.getElementById('mp3-play-icon');
  const fill     = document.getElementById('mp3-fill');
  const track    = document.getElementById('mp3-track');

  const PLAY_SVG  = '<polygon points="3,1 14,8 3,15"/>';
  const PAUSE_SVG = '<rect x="2" y="1" width="5" height="14"/><rect x="9" y="1" width="5" height="14"/>';

  audio.volume = 0.6;

  const dpGifWrap = document.getElementById('dp-gif-wrap');

  function allNodesOff() {
    cancelAllAnimations();
    for (let s = 0; s < 8; s++)
      for (let n = 0; n < NR; n++)
        setNode(s, n, 'off');
    for (let i = 0; i < N_SEGS; i++)
      segPaths[i].setAttribute('stroke', OFF_RING);
    animateBpm(bpmState.current, 0);
  }

  function allNodesOn() {
    for (let s = 0; s < 8; s++)
      for (let n = 0; n < NR; n++) {
        const r = Math.random();
        setNode(s, n, r < 0.25 ? 'cyan' : r < 0.50 ? 'red' : r < 0.75 ? 'orange' : 'off');
      }
    for (let i = 0; i < N_SEGS; i++) {
      const r = Math.random();
      setSeg(i, r < 0.33 ? 'red' : r < 0.66 ? 'orange' : 'cyan');
    }
    animateBpm(0, bpmState.current);
  }

  function setPlaying(state) {
    mp3IsPlaying = state;
    if (state) {
      dpGifWrap.classList.add('playing');
      allNodesOn();
    } else {
      dpGifWrap.classList.remove('playing');
      mp3Rings.forEach(r => { r.style.animation = 'none'; });
      mp3Player.classList.remove('beat-flash');
      allNodesOff();
    }
  }

  audio.addEventListener('timeupdate', () => {
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    fill.style.width = pct + '%';
  });

  audio.addEventListener('ended', () => {
    playIcon.innerHTML = PLAY_SVG;
    setPlaying(false);
    fill.style.width = '0%';
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      playIcon.innerHTML = PAUSE_SVG;
      setPlaying(true);
      audio.play().then(() => {
        nextBeatTime = performance.now() + bpmState.beatMs;
      });
    } else {
      audio.pause();
      playIcon.innerHTML = PLAY_SVG;
      setPlaying(false);
    }
  });

  stopBtn.addEventListener('click', () => {
    audio.pause();
    audio.currentTime = 0;
    fill.style.width = '0%';
    playIcon.innerHTML = PLAY_SVG;
    setPlaying(false);
  });

  track.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = track.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });
})();

</script>
